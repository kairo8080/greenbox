<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Greenbox</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14272b;color:#efe6ce;font-family:system-ui,sans-serif}
    #unity-canvas{width:100%;height:100%;display:block;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#14272b;gap:12px}
    h1{margin:0;font-size:38px;letter-spacing:3px}p{margin:0;color:#adbfaf}progress{width:280px;accent-color:#d5b657}
    #error{max-width:620px;padding:20px;color:#ffb2aa;white-space:pre-wrap}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Greenbox voxel growing game"></canvas>
  <div id="loading"><h1>GREENBOX</h1><p>Your first room. Your first roots.</p><progress id="progress" value="0" max="1"></progress><p id="status">Loading the bedroom…</p><div id="error" hidden></div></div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      devicePixelRatio: 1
    };
    const script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    function failed(error) {
      document.getElementById('status').textContent = 'Unable to start Greenbox';
      const message = document.getElementById('error');
      message.hidden = false; message.textContent = String(error);
    }
    script.onerror = () => failed('Game files could not be loaded. Reload to try again.');
    script.onload = () => createUnityInstance(canvas, config, value => progress.value = value)
      .then(instance => {
        window.greenbox = instance; loading.style.display = 'none'; canvas.focus();
        function save() { instance.SendMessage('Greenbox', 'Save'); }
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { save(); instance.SendMessage('Greenbox', 'SetBrowserHidden', '1'); }
          else instance.SendMessage('Greenbox', 'SetBrowserHidden', '0');
        });
        window.addEventListener('pagehide', save);
      }).catch(failed);
    document.body.appendChild(script);
  </script>
</body>
</html>
